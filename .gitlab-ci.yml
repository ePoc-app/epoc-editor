stages:
  - build
  - release
  - trigger_signing

# Job 1: Build-only (runs on every commit to main)
build:
  stage: build
  tags:
    - macos
  before_script:
    # Load nvm
    - \. "$HOME/.nvm/nvm.sh"
  script:
    # Install dependencies
    - npm install
    # Create env file
    - env | grep -v '^_' > .env
    # Update preview and build (without publishing)
    - npm run updatePreview
    - npm run build -- -- --publish never
  artifacts:
    paths:
      - dist/
      - dist_electron/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null'

# Job 2: Build and publish (runs only manually, on tags)
release:
  stage: release
  tags:
    - macos
  before_script:
    # Load nvm
    - \. "$HOME/.nvm/nvm.sh"
  script:
    # Install dependencies
    - npm install
    # CI variables are already in the environment, the scripts only need the .env file to exist
    - touch .env
    # Update preview and release
    - npm run updatePreview
    - npm run release
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: false
  needs: []

# Job 3: Trigger signing pipeline in another repository
trigger_signing:
  stage: trigger_signing
  script:
    - echo "Triggering signing pipeline..."
    - curl --fail -X POST -F token=$SIGN_REPO_TRIGGER_TOKEN -F ref=main $SIGN_REPO_URL
  tags:
    - macos
  rules:
    - if: $CI_COMMIT_TAG
  needs: ["release"]
